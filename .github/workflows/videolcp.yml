name: lcp action

on:
  # Belirli aralıklarla otomatik çalışması için
  schedule:
    - cron: '0 * * * *'
  
  # Manuel olarak Actions sekmesinden tetiklenebilmesi için
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Repo'yu Kopyala (Checkout)
      uses: actions/checkout@v4
      
    - name: config
      run: |
          git config --global user.email "<>"
          git config --global user.name "lcp bot"
      

    - name: Python Ortamını Kur
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Bağımlılıkları Yükle
      run: |
        python -m pip install --upgrade pip
        pip install requests playwright
        playwright install chromium

    - name: Python Scriptini Çalıştır
      run: python py/videolcp.py > fr/videolcp.m3u8

    - name: Değişiklikleri Kaydet ve Gönder (Commit & Push)
      run: |
        git add fr/
        git diff --quiet && git diff --cached --quiet || (git commit -m "update lcp link $(date +'%Y-%m-%d %H:%M:%S')" && git push)
